<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AeroAlert</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div class="header-main">
        <div>
          <h1>AeroAlert</h1>
          <p id="status-text">No location configured. Open settings to begin.</p>
        </div>
        <div class="header-actions">
          <button id="toggle-sound-btn" class="icon-btn" title="Toggle Notifications">🔔</button>
          <button id="toggle-settings-btn" class="icon-btn" title="Configure Location">⚙️</button>
        </div>
      </div>

      <div id="settings-panel" class="settings-drawer hidden">
        <form id="config-form">
          <div class="search-row">
            <input type="text" id="address-input" placeholder="Enter city or address (e.g. Lisbon, Porto)..." />
            <button type="button" id="search-address-btn" class="quick-btn">Search</button>
          </div>

          <div id="map-container"></div>

          <div class="manual-coords">
            <div class="field">
              <label for="lat">Latitude</label>
              <input type="number" step="any" id="lat" required placeholder="38.748">
            </div>
            <div class="field">
              <label for="lon">Longitude</label>
              <input type="number" step="any" id="lon" required placeholder="-9.155">
            </div>
            <div class="field">
              <label for="dist">Radius (km)</label>
              <input type="number" step="any" id="dist" required placeholder="5">
            </div>
          </div>

          <div class="form-actions">
            <button type="button" id="cancel-btn" class="btn-secondary">Close</button>
            <button type="submit" id="save-btn" class="btn-primary">Apply & Monitor</button>
          </div>
        </form>
      </div>
    </header>

    <main class="app-content">
      <div class="list-header">
        <h2>Recently Detected Flights</h2>
        <span id="flight-count" class="count-badge">0</span>
      </div>

      <div id="flights-scroll-area" class="scroll-container">
        <div id="flights-container">
          <div class="empty-state">No flights detected nearby yet.</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
